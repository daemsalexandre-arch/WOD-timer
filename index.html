<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>WOD Timer</title>
<style>
  :root{
    --bg:#0b0b0e; --panel:#16161c; --panel2:#1f1f27; --line:#2c2c36;
    --txt:#f4f4f6; --mute:#9a9aa8;
    --work:#22c55e; --rest:#ef4444; --prep:#f59e0b; --accent:#22c55e;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-user-select:none;user-select:none}
  .wrap{max-width:560px;margin:0 auto;padding:16px 16px 32px}
  h1{font-size:22px;letter-spacing:.08em;text-transform:uppercase;margin:4px 0 14px;font-weight:800}
  h1 span{color:var(--accent)}
  .modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
  .modes button{background:var(--panel);color:var(--txt);border:2px solid var(--line);border-radius:14px;
    padding:12px 6px;font-size:15px;font-weight:700;cursor:pointer;line-height:1.2}
  .modes button small{display:block;font-weight:500;color:var(--mute);font-size:11px;margin-top:3px}
  .modes button.on{border-color:var(--accent);background:#10251a}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
  .card h2{font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--mute);margin:0 0 10px;font-weight:700}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0}
  .row + .row{border-top:1px solid var(--line)}
  .row label{font-size:16px;font-weight:600}
  .row label small{display:block;color:var(--mute);font-weight:400;font-size:12px}
  .stepper{display:flex;align-items:center;gap:6px}
  .stepper button{width:48px;height:48px;border-radius:12px;border:none;background:var(--panel2);
    color:var(--txt);font-size:26px;font-weight:700;cursor:pointer}
  .stepper button:active{background:#33333f}
  .stepper .val{min-width:88px;text-align:center;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
  .chips button{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:999px;
    padding:8px 12px;font-size:14px;font-weight:600;cursor:pointer}
  .toggle{position:relative;width:56px;height:32px;flex:none}
  .toggle input{opacity:0;width:0;height:0}
  .toggle span{position:absolute;inset:0;background:var(--panel2);border-radius:999px;transition:.2s;border:1px solid var(--line)}
  .toggle span:before{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
  .toggle input:checked + span{background:var(--accent)}
  .toggle input:checked + span:before{transform:translateX(24px)}
  input[type=range]{width:150px;accent-color:var(--accent)}
  .total{text-align:center;color:var(--mute);font-size:15px;margin:6px 0 12px}
  .total b{color:var(--txt);font-variant-numeric:tabular-nums}
  .start{width:100%;padding:22px;font-size:26px;font-weight:900;letter-spacing:.1em;border:none;border-radius:18px;
    background:var(--accent);color:#04120a;cursor:pointer;text-transform:uppercase}
  .start:active{transform:scale(.98)}
  .test{width:100%;margin-top:8px;padding:12px;font-size:15px;background:transparent;color:var(--mute);
    border:1px dashed var(--line);border-radius:12px;cursor:pointer}
  .hint{color:var(--mute);font-size:12px;text-align:center;margin-top:12px;line-height:1.5}

  /* ---------- écran de course ---------- */
  #run{position:fixed;inset:0;display:none;flex-direction:column;background:var(--bg);z-index:10;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  #run.show{display:flex}
  #run .top{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;font-weight:800;
    font-size:clamp(16px,4.5vw,28px);text-transform:uppercase;letter-spacing:.06em}
  #run .top .rnd{font-variant-numeric:tabular-nums}
  #run .mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 8px}
  #phase{font-size:clamp(28px,9vw,80px);font-weight:900;letter-spacing:.12em;text-transform:uppercase}
  #clock{font-size:clamp(90px,30vw,46vh);font-weight:900;line-height:.95;font-variant-numeric:tabular-nums;
    letter-spacing:-.02em}
  #sub{font-size:clamp(16px,4.5vw,30px);color:var(--mute);margin-top:10px;font-variant-numeric:tabular-nums;text-align:center}
  #bar{height:14px;background:var(--panel2);margin:0 18px;border-radius:999px;overflow:hidden}
  #bar i{display:block;height:100%;width:0;background:currentColor}
  #run .ctrl{display:grid;grid-template-columns:1fr 2fr 1fr;gap:10px;padding:16px 18px 20px}
  #run .ctrl button{padding:20px 6px;border-radius:16px;border:none;font-size:clamp(16px,4.5vw,24px);font-weight:800;
    cursor:pointer;background:var(--panel2);color:var(--txt);text-transform:uppercase}
  #btnPause{background:var(--txt)!important;color:var(--bg)!important}
  #run.work{color:var(--work)} #run.rest{color:var(--rest)} #run.prep{color:var(--prep)} #run.done{color:var(--txt)}
  #run.work #clock,#run.rest #clock,#run.prep #clock{color:var(--txt)}
  #run.alert{animation:flash 1s steps(1) infinite}
  #run.alert #clock{color:var(--work)}
  @keyframes flash{0%{background:#0b2414}50%{background:var(--bg)}}
  #run.halfflash{animation:half .6s ease-out 1}
  @keyframes half{0%{background:#3a2a05}100%{background:var(--bg)}}
  #run.paused #clock{opacity:.45}
  #confirm{color:var(--rest)!important}
  #run .body{flex:1;display:flex;flex-direction:column;min-height:0}
  #count{display:none;padding:10px 18px 12px}
  #run.withcount #count{display:flex}
  #run.withcount #clock{font-size:clamp(80px,26vw,28vh)}
  .cbox{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:10px;color:var(--txt)}
  .cbox .lab{font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);display:flex;justify-content:space-between;font-weight:800}
  .crow{display:flex;align-items:center;gap:10px}
  .cbox .num{font-size:clamp(56px,16vw,110px);font-weight:900;font-variant-numeric:tabular-nums;line-height:.9}
  #btnRound{width:100%;min-height:max(120px,19vh);border:none;border-radius:18px;background:var(--work);color:#04120a;
    font-size:clamp(32px,9vw,60px);font-weight:900;text-transform:uppercase;cursor:pointer;touch-action:manipulation;
    box-shadow:0 6px 0 #15803d}
  #btnRound:active{transform:translateY(4px);box-shadow:0 2px 0 #15803d}
  #btnRound.hit{animation:hit .35s ease-out}
  @keyframes hit{0%{background:#fff}100%{background:var(--work)}}
  .mini{margin-left:auto;border:2px solid var(--line);border-radius:14px;background:var(--panel2);color:var(--txt);
    font-size:22px;font-weight:800;padding:14px 20px;cursor:pointer;touch-action:manipulation}
  /* ---- paysage (téléphone couché) ---- */
  @media (orientation:landscape) and (max-height:600px){
    #run .top{padding:6px 18px;font-size:18px}
    #run .body{flex-direction:row}
    #run .mid{flex:1}
    #phase{font-size:min(7vw,11vh)}
    #clock{font-size:min(28vw,54vh)}
    #run.withcount #clock{font-size:min(21vw,50vh)}
    #sub{font-size:16px;margin-top:4px}
    #score{font-size:22px;margin-top:4px}
    #count{width:38%;padding:4px 16px 6px 0}
    .cbox{padding:10px;gap:8px}
    .cbox .num{font-size:min(14vh,72px)}
    #btnRound{flex:1;min-height:0;font-size:min(5vw,11vh)}
    .mini{padding:8px 16px;font-size:18px}
    #bar{height:10px;margin:0 16px}
    #run .ctrl{padding:8px 16px 10px}
    #run .ctrl button{padding:12px 6px;font-size:18px}
  }
  #score{font-size:clamp(22px,6vw,40px);font-weight:900;color:var(--txt);margin-top:10px;text-align:center}
</style>
</head>
<body>
<div class="wrap" id="setup">
  <h1>WOD <span>Timer</span></h1>

  <div class="modes" id="modes">
    <button data-m="fortime">For Time<small>chrono ↑</small></button>
    <button data-m="amrap">AMRAP<small>chrono ↓</small></button>
    <button data-m="emom">EMOM<small>toutes les X</small></button>
    <button data-m="intervals">Intervalles<small>travail / repos</small></button>
    <button data-m="tabata">Tabata<small>20 / 10 × 8</small></button>
    <button data-m="custom">Mixte<small>EMOM + repos</small></button>
  </div>

  <div class="card" id="settings"></div>

  <div class="card" id="opts">
    <h2>Sons & options</h2>
    <div class="row"><label>Préparation<small>décompte avant le départ</small></label><div class="stepper" data-k="prep" data-step="5" data-min="0" data-max="60" data-f="s"></div></div>
    <div class="row"><label>Bip mi-temps<small>à la moitié de chaque phase de travail</small></label><label class="toggle"><input type="checkbox" data-k="half"><span></span></label></div>
    <div class="row"><label>Décompte 10 s<small>bip chaque seconde en fin de travail</small></label><label class="toggle"><input type="checkbox" data-k="last10"><span></span></label></div>
    <div class="row"><label>Voix<small>« Go », « Repos », « Mi-temps »…</small></label><label class="toggle"><input type="checkbox" data-k="voice"><span></span></label></div>
    <div class="row"><label>Volume</label><input type="range" min="0.1" max="1" step="0.05" data-k="vol"></div>
  </div>

  <div class="total" id="total"></div>
  <button class="start" id="btnStart">Start</button>
  <button class="test" id="btnTest">🔊 Tester les sons</button>
  <p class="hint">Sur iPhone, désactive le mode silencieux : il coupe le son des pages web.<br>Garde l'écran allumé pendant le WOD.</p>
</div>

<div id="run">
  <div class="top"><span id="rMode">AMRAP</span><span class="rnd" id="rRound"></span></div>
  <div class="body">
    <div class="mid">
      <div id="phase">Prêt</div>
      <div id="clock">00:00</div>
      <div id="sub"></div>
      <div id="score"></div>
    </div>
    <div id="count">
      <div class="cbox">
        <div class="lab"><span>Rounds</span><span id="split"></span></div>
        <div class="crow"><div class="num" id="nRounds">0</div><button class="mini" id="rMinus">−1</button></div>
        <button id="btnRound">+1 Round</button>
      </div>
    </div>
  </div>
  <div id="bar"><i></i></div>
  <div class="ctrl">
    <button id="btnStop">Stop</button>
    <button id="btnPause">Pause</button>
    <button id="btnFs">⛶</button>
  </div>
</div>

<script>
(function(){
/* ---------- réglages par défaut ---------- */
const DEF = {
  mode:'amrap',
  ftCap:0,              // For Time : time cap en minutes (0 = sans limite)
  amrapMin:12,
  emomEvery:60, emomRounds:10,
  intWork:40, intRest:20, intRounds:10,
  tabWork:20, tabRest:10, tabRounds:8,
  cusEvery:60, cusRounds:5, cusSets:3, cusSetRest:60,
  prep:10, counter:true, half:true, last10:true, voice:true, vol:0.8
};
let S = Object.assign({}, DEF);
try{ const saved = JSON.parse(localStorage.getItem('wodTimer')||'null'); if(saved) S = Object.assign(S, saved); }catch(e){}
function save(){ try{ localStorage.setItem('wodTimer', JSON.stringify(S)); }catch(e){} }

const MODE_NAMES = {fortime:'For Time', amrap:'AMRAP', emom:'EMOM', intervals:'Intervalles', tabata:'Tabata', custom:'Mixte'};

const SETTINGS = {
  fortime:[
    {k:'ftCap', label:'Time cap', sub:'0 = pas de limite', step:1, min:0, max:90, f:'min'},
    {toggle:'counter', label:'Compteur de rounds', sub:'gros bouton +1 pendant le WOD'}
  ],
  amrap:[
    {k:'amrapMin', label:'Durée', step:1, min:1, max:90, f:'min'},
    {toggle:'counter', label:'Compteur de rounds', sub:'gros bouton +1 pendant le WOD'}
  ],
  emom:[
    {k:'emomEvery', label:'Toutes les', step:15, min:15, max:600, f:'s'},
    {k:'emomRounds', label:'Rounds', step:1, min:1, max:99, f:'n'}
  ],
  intervals:[
    {k:'intWork', label:'Travail', step:5, min:5, max:600, f:'s'},
    {k:'intRest', label:'Repos', step:5, min:0, max:600, f:'s'},
    {k:'intRounds', label:'Rounds', step:1, min:1, max:99, f:'n'},
    {chips:[[40,20],[45,15],[30,30],[50,10],[60,30],[90,30]], keys:['intWork','intRest']}
  ],
  tabata:[
    {k:'tabWork', label:'Travail', step:5, min:5, max:120, f:'s'},
    {k:'tabRest', label:'Repos', step:5, min:0, max:120, f:'s'},
    {k:'tabRounds', label:'Rounds', step:1, min:1, max:30, f:'n'}
  ],
  custom:[
    {k:'cusEvery', label:'EMOM toutes les', step:15, min:15, max:600, f:'s'},
    {k:'cusRounds', label:'Rounds par bloc', step:1, min:1, max:30, f:'n'},
    {k:'cusSets', label:'Nombre de blocs', step:1, min:1, max:10, f:'n'},
    {k:'cusSetRest', label:'Repos entre blocs', step:15, min:0, max:600, f:'s'}
  ]
};

/* ---------- format ---------- */
function mmss(sec){
  sec = Math.max(0, sec);
  const m = Math.floor(sec/60), s = Math.floor(sec%60);
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function fmt(v,f){
  if(f==='min') return v===0 ? '—' : v+' min';
  if(f==='s') return v<60 ? v+' s' : mmss(v);
  return String(v);
}

/* ---------- construction de l'UI ---------- */
function stepperHTML(o){
  return `<div class="row"><label>${o.label}${o.sub?`<small>${o.sub}</small>`:''}</label>
    <div class="stepper" data-k="${o.k}" data-step="${o.step}" data-min="${o.min}" data-max="${o.max}" data-f="${o.f}"></div></div>`;
}
function renderSettings(){
  const box = document.getElementById('settings');
  let h = `<h2>${MODE_NAMES[S.mode]}</h2>`;
  SETTINGS[S.mode].forEach(o=>{
    if(o.chips){
      h += `<div class="chips">` + o.chips.map(c=>`<button data-c="${c.join(',')}" data-keys="${o.keys.join(',')}">${c[0]}/${c[1]}</button>`).join('') + `</div>`;
    } else if(o.toggle){
      h += `<div class="row"><label>${o.label}<small>${o.sub}</small></label><label class="toggle"><input type="checkbox" data-t="${o.toggle}" ${S[o.toggle]?'checked':''}><span></span></label></div>`;
    } else h += stepperHTML(o);
  });
  box.innerHTML = h;
  box.querySelectorAll('.chips button').forEach(b=>b.onclick=()=>{
    const vals=b.dataset.c.split(',').map(Number), keys=b.dataset.keys.split(',');
    keys.forEach((k,i)=>S[k]=vals[i]); save(); renderSettings(); updateTotal();
  });
  box.querySelectorAll('input[data-t]').forEach(i=>i.onchange=()=>{ S[i.dataset.t]=i.checked; save(); });
  initSteppers(box);
  document.querySelectorAll('#modes button').forEach(b=>b.classList.toggle('on', b.dataset.m===S.mode));
}
function initSteppers(root){
  root.querySelectorAll('.stepper').forEach(el=>{
    const k=el.dataset.k, step=+el.dataset.step, min=+el.dataset.min, max=+el.dataset.max, f=el.dataset.f;
    el.innerHTML = `<button aria-label="moins">−</button><div class="val"></div><button aria-label="plus">+</button>`;
    const val = el.querySelector('.val');
    const show = ()=> val.textContent = fmt(S[k], f);
    const bump = d => { S[k] = Math.min(max, Math.max(min, S[k] + d*step)); show(); save(); updateTotal(); };
    const [minus, plus] = el.querySelectorAll('button');
    // appui long = répétition
    [[minus,-1],[plus,1]].forEach(([btn,d])=>{
      let t1,t2;
      const stop=()=>{clearTimeout(t1);clearInterval(t2);};
      btn.addEventListener('pointerdown',e=>{e.preventDefault();bump(d);t1=setTimeout(()=>{t2=setInterval(()=>bump(d),90);},400);});
      ['pointerup','pointerleave','pointercancel'].forEach(ev=>btn.addEventListener(ev,stop));
    });
    show();
  });
}
document.querySelectorAll('#modes button').forEach(b=>b.onclick=()=>{ S.mode=b.dataset.m; save(); renderSettings(); updateTotal(); });
document.querySelectorAll('input[type=checkbox][data-k]').forEach(i=>{ i.checked=!!S[i.dataset.k]; i.onchange=()=>{S[i.dataset.k]=i.checked; save();}; });
document.querySelectorAll('input[type=range][data-k]').forEach(i=>{ i.value=S[i.dataset.k]; i.oninput=()=>{S[i.dataset.k]=+i.value; save(); if(master) master.gain.value=S.vol;}; });
initSteppers(document.getElementById('opts'));

/* ---------- séquence de segments ---------- */
function buildSegments(){
  const seg=[];
  const push=(type,dur,extra)=>{ if(dur>0) seg.push(Object.assign({type,dur,dir:'down'},extra||{})); };
  if(S.prep>0) push('prep', S.prep);
  switch(S.mode){
    case 'fortime': seg.push({type:'work', dur: S.ftCap>0 ? S.ftCap*60 : Infinity, dir:'up'}); break;
    case 'amrap': push('work', S.amrapMin*60); break;
    case 'emom': for(let r=1;r<=S.emomRounds;r++) push('work', S.emomEvery, {round:r, of:S.emomRounds}); break;
    case 'intervals': case 'tabata': {
      const w = S.mode==='tabata'?S.tabWork:S.intWork, re = S.mode==='tabata'?S.tabRest:S.intRest, n = S.mode==='tabata'?S.tabRounds:S.intRounds;
      for(let r=1;r<=n;r++){ push('work', w, {round:r, of:n}); if(r<n) push('rest', re, {round:r, of:n}); }
      break; }
    case 'custom':
      for(let b=1;b<=S.cusSets;b++){
        for(let r=1;r<=S.cusRounds;r++) push('work', S.cusEvery, {round:r, of:S.cusRounds, set:b, sets:S.cusSets});
        if(b<S.cusSets) push('rest', S.cusSetRest, {set:b, sets:S.cusSets, setRest:true});
      }
      break;
  }
  let t=0; seg.forEach(s=>{ s.start=t; t+=s.dur; });
  return seg;
}
function updateTotal(){
  const seg = buildSegments().filter(s=>s.type!=='prep');
  const tot = seg.reduce((a,s)=>a+s.dur,0);
  document.getElementById('total').innerHTML = isFinite(tot) ? `Durée totale : <b>${mmss(tot)}</b>` : `Durée : <b>sans limite</b>`;
}

/* ---------- audio ---------- */
let ac=null, master=null;
function ensureAudio(){
  try{
    if(!ac){
      ac = new (window.AudioContext||window.webkitAudioContext)();
      const comp = ac.createDynamicsCompressor();
      master = ac.createGain(); master.gain.value = S.vol;
      master.connect(comp); comp.connect(ac.destination);
    }
    if(ac.state==='suspended') ac.resume();
  }catch(e){}
}
function tone(freq, dur, when=0, type='square', vol=0.9){
  if(!ac) return;
  const t = ac.currentTime + when;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type=type; o.frequency.value=freq;
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+0.01);
  g.gain.setValueAtTime(vol,t+Math.max(0.02,dur-0.04));
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.05);
}
const SND = {
  tick:   ()=> tone(880, 0.12),
  tickHi: ()=> tone(1320, 0.2),
  go:     ()=> { tone(1760, 0.8, 0, 'square'); tone(880, 0.8, 0, 'sawtooth', 0.4); },
  rest:   ()=> { tone(520, 0.35); tone(390, 0.5, 0.38); },
  half:   ()=> { tone(1046, 0.15); tone(1046, 0.15, 0.22); tone(1568, 0.35, 0.44); },
  minute: ()=> { tone(1046, 0.12); tone(1046, 0.12, 0.18); },
  end:    ()=> { tone(1760,0.5); tone(1760,0.5,0.65); tone(1760,1.2,1.3); }
};
let frVoice=null;
function pickVoice(){ try{ const v=speechSynthesis.getVoices(); frVoice = v.find(x=>/^fr/i.test(x.lang)) || null; }catch(e){} }
try{ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }catch(e){}
function say(txt){
  if(!S.voice) return;
  try{
    const u = new SpeechSynthesisUtterance(txt);
    u.lang='fr-FR'; if(frVoice) u.voice=frVoice; u.rate=1.05; u.volume=1;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------- moteur ---------- */
const $run=document.getElementById('run'), $phase=document.getElementById('phase'), $clock=document.getElementById('clock'),
      $sub=document.getElementById('sub'), $bar=document.querySelector('#bar i'), $rMode=document.getElementById('rMode'),
      $rRound=document.getElementById('rRound'), $pause=document.getElementById('btnPause'), $stop=document.getElementById('btnStop');
let segs=[], acc=0, t0=0, running=false, finished=false, cur=-1, lastRem=null, lastMin=0, timer=null, wakeLock=null, stopArm=null;

/* ---------- compteur de rounds ---------- */
let rounds=0, lastSplit=0, lastLap=null;
const $nR=document.getElementById('nRounds'), $split=document.getElementById('split'), $score=document.getElementById('score'), $btnRound=document.getElementById('btnRound');
function countOn(){ return S.counter && (S.mode==='amrap' || S.mode==='fortime'); }
function workT(){ const w=segs.find(s=>s.type==='work'); return w ? Math.max(0, elapsed()-w.start) : 0; }
function inWork(){ return !finished && segs[cur] && segs[cur].type==='work'; }
function scoreTxt(){ return rounds + (rounds>1?' rounds':' round'); }
function renderCount(){ $nR.textContent=rounds; $split.textContent = lastLap!=null ? 'dernier ' + mmss(lastLap) : ''; }
function feedback(f){ ensureAudio(); tone(f,0.08,0,'square',0.5); try{ navigator.vibrate && navigator.vibrate(40); }catch(e){} }
$btnRound.addEventListener('pointerdown', e=>{
  e.preventDefault(); if(!inWork()) return;
  const t=workT(); lastLap=t-lastSplit; lastSplit=t; rounds++; feedback(1320); renderCount();
  $btnRound.classList.remove('hit'); void $btnRound.offsetWidth; $btnRound.classList.add('hit');
});
document.getElementById('rMinus').onclick=()=>{ if(rounds>0){ rounds--; lastLap=null; feedback(440); renderCount(); } };

function elapsed(){ return acc + (running ? (performance.now()-t0)/1000 : 0); }
function totalDur(){ const l=segs[segs.length-1]; return l.start+l.dur; }

function start(){
  ensureAudio();
  segs = buildSegments(); acc=0; cur=-1; lastRem=null; lastMin=0; finished=false;
  segs.forEach(s=>s.halfDone=false);
  $rMode.textContent = MODE_NAMES[S.mode];
  $run.className='show' + (countOn()?' withcount':''); document.body.style.overflow='hidden';
  rounds=0; lastSplit=0; lastLap=null; $score.textContent=''; renderCount();
  resume();
  requestWake();
}
function resume(){ ensureAudio(); t0=performance.now(); running=true; $pause.textContent='Pause'; $run.classList.remove('paused');
  clearInterval(timer); timer=setInterval(tick,50); tick(); }
function pause(){ acc=elapsed(); running=false; $pause.textContent='Reprendre'; $run.classList.add('paused'); tick(); }
function stop(){
  running=false; clearInterval(timer); $run.className=''; document.body.style.overflow='';
  try{ speechSynthesis.cancel(); }catch(e){}
  releaseWake();
}
function finish(){
  finished=true; running=false; clearInterval(timer);
  SND.end(); say('Terminé');
  const last = segs[segs.length-1];
  $run.className='show done' + (countOn()?' withcount':'');
  if(countOn()) $score.textContent = 'Score : ' + scoreTxt();
  $phase.textContent='Terminé';
  $clock.textContent = mmss(last.dir==='up' ? Math.min(elapsed()-last.start, last.dur) : (S.mode==='amrap'?last.dur:totalDur()-(segs[0].type==='prep'?segs[0].dur:0)));
  $sub.textContent=''; $bar.style.width='100%';
  $pause.textContent='Rejouer';
}

function setPhaseClass(type){ ['work','rest','prep','alert','done'].forEach(c=>$run.classList.remove(c)); $run.classList.add(type); }

function enterSeg(i){
  const s=segs[i]; lastRem=null; lastMin=0;
  setPhaseClass(s.type);
  if(s.type==='work'){ SND.go(); say(i===0||segs[i-1].type==='prep'?'Go':(segs[i-1].type==='rest'?'Go':'')); }
  else if(s.type==='rest'){ SND.rest(); say('Repos'); }
  else if(s.type==='prep'){ say('Préparez-vous'); }
}

function tick(){
  if(finished) return;
  const e = elapsed();
  let i = segs.findIndex(s=> e < s.start + s.dur);
  if(i===-1){ finish(); return; }
  const s = segs[i];
  if(i!==cur){ cur=i; if(running) enterSeg(i); else setPhaseClass(s.type); }
  const inSeg = e - s.start, rem = s.dur - inSeg;

  // --- sons ---
  if(running){
    if(isFinite(rem)){
      const r = Math.ceil(rem);
      if(r!==lastRem){
        lastRem = r;
        if(s.type==='work'){
          if(S.last10 && r<=10 && r>=1){ r<=3 ? SND.tickHi() : SND.tick(); }
          if(S.last10 && r===10 && s.dur>20) say('10 secondes');
        } else if(r<=3 && r>=1){ r===1?SND.tickHi():SND.tick(); }
      }
    } else {
      // For Time sans cap : petit bip chaque minute
      const m = Math.floor(inSeg/60);
      if(m>lastMin){ lastMin=m; SND.minute(); }
    }
    if(s.type==='work' && S.half && isFinite(s.dur) && s.dur>20 && !s.halfDone && inSeg >= s.dur/2){
      s.halfDone=true; SND.half(); say('Mi-temps');
      $run.classList.remove('halfflash'); void $run.offsetWidth; $run.classList.add('halfflash');
    }
  }

  // --- affichage ---
  const show = s.dir==='up' ? Math.floor(inSeg) : Math.ceil(rem);
  $clock.textContent = mmss(show);
  $phase.textContent = s.type==='work' ? (s.dir==='up'?'For Time':'Travail') : s.type==='rest' ? (s.setRest?'Repos bloc':'Repos') : 'Prêt ?';
  $run.classList.toggle('alert', s.type==='work' && isFinite(rem) && rem<=10 && S.last10 && running);

  let rnd='';
  if(s.round) rnd = (S.mode==='emom'&&S.emomEvery===60 ? 'Min ' : 'Round ') + s.round + '/' + s.of;
  if(s.sets) rnd = 'Bloc ' + s.set + '/' + s.sets + (s.round ? ' · R' + s.round + '/' + s.of : '');
  $rRound.textContent = rnd;

  if(s.type==='prep') $sub.textContent = 'Départ dans…';
  else if(s.dir==='up') $sub.textContent = isFinite(s.dur) ? 'Time cap ' + mmss(s.dur) : '';
  else {
    const prepDur = segs[0].type==='prep'?segs[0].dur:0;
    const left = totalDur() - e;
    $sub.textContent = segs.length - (prepDur?1:0) > 1 ? 'Reste au total ' + mmss(Math.ceil(left)) : '';
  }
  $bar.style.width = (isFinite(s.dur) ? Math.min(100, inSeg/s.dur*100) : (inSeg%60)/60*100) + '%';
}

/* ---------- écran allumé / plein écran ---------- */
async function requestWake(){ try{ if('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); }catch(e){} }
function releaseWake(){ try{ wakeLock && wakeLock.release(); }catch(e){} wakeLock=null; }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible' && $run.classList.contains('show')) requestWake(); });

/* ---------- boutons ---------- */
document.getElementById('btnStart').onclick = start;
document.getElementById('btnTest').onclick = ()=>{ ensureAudio(); SND.tick(); setTimeout(SND.tickHi,500); setTimeout(SND.half,1000); setTimeout(SND.go,2000); setTimeout(()=>say('Mi-temps'),3000); };
$pause.onclick = ()=>{ if(finished){ start(); return; } running ? pause() : resume(); };
$stop.onclick = ()=>{
  if(finished || !running && acc===0){ stop(); return; }
  if(stopArm){ clearTimeout(stopArm); stopArm=null; $stop.textContent='Stop'; $stop.id='btnStop'; stop(); return; }
  $stop.textContent='Sûr ?'; $stop.id='confirm';
  stopArm=setTimeout(()=>{ stopArm=null; $stop.textContent='Stop'; $stop.id='btnStop'; },2500);
};
document.getElementById('btnFs').onclick = ()=>{
  try{
    const d=document, el=d.documentElement;
    if(d.fullscreenElement||d.webkitFullscreenElement) (d.exitFullscreen||d.webkitExitFullscreen).call(d);
    else (el.requestFullscreen||el.webkitRequestFullscreen).call(el).catch?.(()=>{});
  }catch(e){}
};
// barre espace = pause (utile sur ordi)
document.addEventListener('keydown',e=>{ if(e.code==='Space' && $run.classList.contains('show')){ e.preventDefault(); $pause.click(); } });

renderSettings(); updateTotal();
})();
</script>
</body>
